name: Investor Council Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-engine-and-modules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify core OS module files exist
        run: |
          for f in \
            os-modules/00-START-HERE-SYSTEM-PROMPT.md \
            os-modules/01-FORENSIC-ACCOUNTING-MANUAL.md \
            os-modules/02-GRASSROOTS-SCUTTLEBUTT-FIELD-GUIDE.md \
            os-modules/03-VALUATION-DCF-IRR-TEMPLATES.md \
            os-modules/04-SPLIT-BRAIN-DEBATE-PROMPTS.md \
            os-modules/05-PORTFOLIO-SIZING-RISK-SELL-DISCIPLINE.md \
            os-modules/valuation_engine.py \
            tools/sync_summaries.py \
            inputs/BKNG.json; do
            test -s "$f" || { echo "Missing or empty: $f"; exit 1; }
          done
          echo "All core files present."

      - name: Run adversarial valuation self-test suite (9 legacy v3 + v4 tests)
        run: python3 os-modules/valuation_engine.py --self-test

      - name: Smoke test — legacy v3 fixture report
        run: python3 os-modules/valuation_engine.py > /dev/null && echo "Legacy fixture report OK"

      - name: Smoke test — v4 report for every inputs/*.json
        run: |
          for f in inputs/*.json; do
            python3 os-modules/valuation_engine.py --input "$f" > /dev/null || { echo "Report failed: $f"; exit 1; }
            echo "v4 report OK: $f"
          done

      - name: Drift check tool self-test
        run: python3 tools/sync_summaries.py --self-test

      - name: Drift check — markdown/README/INDEX must match inputs/*.json via the engine
        run: python3 tools/sync_summaries.py --check
